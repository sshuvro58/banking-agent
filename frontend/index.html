<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banking Assistant</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: #f0f2f5;
    color: #1e293b;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
  }

  /* ── LOGIN SCREEN ───────────────────────── */
  #login-screen {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1a56db 0%, #0f3a8e 100%);
  }

  .login-card {
    background: #ffffff;
    border-radius: 16px;
    padding: 48px 40px;
    width: 420px;
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
  }

  .login-logo {
    font-size: 40px;
    text-align: center;
    margin-bottom: 8px;
  }

  .login-card h2 {
    font-size: 24px;
    font-weight: 700;
    text-align: center;
    color: #1e293b;
    margin-bottom: 4px;
  }

  .login-card .subtitle {
    text-align: center;
    color: #64748b;
    font-size: 14px;
    margin-bottom: 32px;
  }

  .form-group {
    margin-bottom: 20px;
  }

  .form-group label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #475569;
    margin-bottom: 6px;
  }

  .form-group input {
    width: 100%;
    padding: 12px 16px;
    border: 2px solid #e2e8f0;
    border-radius: 10px;
    font-size: 15px;
    color: #1e293b;
    background: #f8fafc;
    outline: none;
    transition: all .2s;
  }

  .form-group input:focus {
    border-color: #1a56db;
    background: #fff;
    box-shadow: 0 0 0 3px rgba(26,86,219,.1);
  }

  .form-group input::placeholder { color: #94a3b8; }

  .login-btn {
    width: 100%;
    padding: 14px;
    background: #1a56db;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background .2s;
    margin-top: 8px;
  }

  .login-btn:hover { background: #1544b8; }
  .login-btn:disabled { opacity: .6; cursor: not-allowed; }

  .login-error {
    background: #fef2f2;
    color: #dc2626;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 16px;
    display: none;
    border: 1px solid #fecaca;
  }

  .login-hint {
    margin-top: 24px;
    padding: 16px;
    background: #f0f9ff;
    border-radius: 10px;
    font-size: 12px;
    color: #475569;
    line-height: 1.7;
    border: 1px solid #bae6fd;
  }

  .login-hint strong { color: #0369a1; }

  /* ── CHAT SCREEN ────────────────────────── */
  #chat-screen {
    display: none;
    flex-direction: column;
    height: 100vh;
  }

  /* Header */
  .chat-header {
    background: #fff;
    border-bottom: 1px solid #e2e8f0;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
    flex-shrink: 0;
  }

  .chat-header h1 {
    font-size: 17px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .user-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: #475569;
    background: #f1f5f9;
    padding: 6px 12px;
    border-radius: 20px;
  }

  .user-badge .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #16a34a;
  }

  .logout-btn {
    background: none;
    border: 1px solid #e2e8f0;
    padding: 6px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    color: #64748b;
    transition: all .15s;
  }

  .logout-btn:hover { border-color: #dc2626; color: #dc2626; }

  /* Messages area */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    background: #f0f2f5;
  }

  .message {
    max-width: 700px;
    padding: 12px 18px;
    border-radius: 12px;
    font-size: 15px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .message.user {
    align-self: flex-end;
    background: #1a56db;
    color: #fff;
    border-bottom-right-radius: 4px;
  }

  .message.assistant {
    align-self: flex-start;
    background: #fff;
    border: 1px solid #e2e8f0;
    border-bottom-left-radius: 4px;
    box-shadow: 0 1px 2px rgba(0,0,0,.05);
  }

  .message.error {
    align-self: flex-start;
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: #dc2626;
    font-size: 14px;
  }

  .message .meta {
    font-size: 11px;
    margin-top: 8px;
    display: flex;
    gap: 12px;
    opacity: .7;
  }

  .typing {
    align-self: flex-start;
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 12px 18px;
    font-size: 14px;
    color: #64748b;
  }

  /* Quick actions */
  .quick-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    padding: 12px 24px;
    background: #f0f2f5;
    flex-shrink: 0;
  }

  .quick-btn {
    padding: 8px 16px;
    background: #fff;
    color: #1a56db;
    border: 1px solid #dbeafe;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    transition: all .15s;
  }

  .quick-btn:hover {
    background: #1a56db;
    color: #fff;
    border-color: #1a56db;
  }

  /* Input bar */
  .input-bar {
    background: #fff;
    border-top: 1px solid #e2e8f0;
    padding: 16px 24px;
    display: flex;
    gap: 12px;
    flex-shrink: 0;
  }

  .input-bar input {
    flex: 1;
    padding: 12px 16px;
    border: 2px solid #e2e8f0;
    border-radius: 10px;
    font-size: 15px;
    outline: none;
    transition: border-color .15s;
  }

  .input-bar input:focus { border-color: #1a56db; }

  .send-btn {
    padding: 12px 28px;
    background: #1a56db;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s;
  }

  .send-btn:hover { background: #1544b8; }
  .send-btn:disabled { opacity: .5; cursor: not-allowed; }

  /* Status bar */
  .status-bar {
    padding: 6px 24px;
    font-size: 11px;
    color: #94a3b8;
    background: #fff;
    border-top: 1px solid #f1f5f9;
    display: flex;
    justify-content: space-between;
    flex-shrink: 0;
  }
</style>
</head>
<body>

<!-- ── LOGIN ────────────────────────────── -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">🏦</div>
    <h2>Banking Assistant</h2>
    <p class="subtitle">Sign in to your account</p>

    <div class="login-error" id="login-error"></div>

    <div class="form-group">
      <label for="username">Customer ID</label>
      <input type="text" id="username" placeholder="e.g. cust_001" autocomplete="off">
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter your password"
             onkeydown="if(event.key==='Enter') login()">
    </div>

    <button class="login-btn" id="login-btn" onclick="login()">Sign In</button>

    <div class="login-hint">
      <strong>Demo accounts:</strong><br>
      <strong>cust_001</strong> / demo — Alice Johnson (full access)<br>
      <strong>cust_002</strong> / demo — Bob Smith (no service requests)
    </div>
  </div>
</div>

<!-- ── CHAT ──────────────────────────────── -->
<div id="chat-screen">
  <div class="chat-header">
    <h1>🏦 Banking Assistant</h1>
    <div class="header-right">
      <div class="user-badge">
        <span class="dot"></span>
        <span id="customer-name"></span>
      </div>
      <button class="logout-btn" onclick="logout()">Sign out</button>
    </div>
  </div>

  <div class="messages" id="messages"></div>

  <div class="quick-actions" id="quick-actions">
    <button class="quick-btn" onclick="quickSend('What is my account balance?')">💰 Balance</button>
    <button class="quick-btn" onclick="quickSend('Show my recent transactions')">📋 Transactions</button>
    <button class="quick-btn" onclick="quickSend('I need my August statement')">📄 Statement</button>
    <button class="quick-btn" onclick="quickSend('I want to request a cheque book')">📘 Cheque book</button>
    <button class="quick-btn" onclick="quickSend('I need to change my address')">🏠 Address</button>
    <button class="quick-btn" onclick="quickSend('I need to update my KYC')">🪪 KYC</button>
  </div>

  <div class="input-bar">
    <input type="text" id="chat-input" placeholder="Type your message..."
           onkeydown="if(event.key==='Enter' && !event.shiftKey) sendMessage()">
    <button class="send-btn" id="send-btn" onclick="sendMessage()">Send</button>
  </div>

  <div class="status-bar">
    <span id="session-info">No active session</span>
    <span id="cost-info"></span>
  </div>
</div>

<script>
  const API = '/api';
  let token = null;
  let sessionId = null;

  // ── LOGIN ──────────────────────────────────
  async function login() {
    const customerId = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();
    const errorEl = document.getElementById('login-error');
    const loginBtn = document.getElementById('login-btn');

    if (!customerId || !password) {
      errorEl.textContent = 'Please enter both Customer ID and Password.';
      errorEl.style.display = 'block';
      return;
    }

    errorEl.style.display = 'none';
    loginBtn.disabled = true;
    loginBtn.textContent = 'Signing in...';

    try {
      const res = await fetch(API + '/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ customer_id: customerId, password: password }),
      });
      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.detail || 'Login failed');
      }

      token = data.access_token;
      sessionId = null;

      // Decode JWT for customer name
      const payload = JSON.parse(atob(token.split('.')[1]));

      // Switch to chat screen
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('chat-screen').style.display = 'flex';
      document.getElementById('customer-name').textContent = payload.name;
      document.getElementById('session-info').textContent = 'New session';
      document.getElementById('cost-info').textContent = '';

      // Welcome message
      document.getElementById('messages').innerHTML = '';
      addMessage('assistant',
        `Welcome, ${payload.name}! I'm your banking assistant.\n\n` +
        `I can help you with:\n` +
        `• Check account balances\n` +
        `• View transaction history\n` +
        `• Generate statements\n` +
        `• Change address, request cheque books, update KYC\n\n` +
        `How can I help you today?`
      );

      document.getElementById('chat-input').focus();

    } catch (err) {
      errorEl.textContent = err.message;
      errorEl.style.display = 'block';
    } finally {
      loginBtn.disabled = false;
      loginBtn.textContent = 'Sign In';
    }
  }

  // ── LOGOUT ─────────────────────────────────
  function logout() {
    token = null;
    sessionId = null;
    document.getElementById('chat-screen').style.display = 'none';
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('username').value = '';
    document.getElementById('password').value = '';
    document.getElementById('login-error').style.display = 'none';
  }

  // ── SEND MESSAGE ───────────────────────────
  function quickSend(text) {
    document.getElementById('chat-input').value = text;
    sendMessage();
  }

  async function sendMessage() {
    const input = document.getElementById('chat-input');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';

    addMessage('user', text);

    // Typing indicator
    const typing = document.createElement('div');
    typing.className = 'typing';
    typing.textContent = 'Thinking...';
    document.getElementById('messages').appendChild(typing);
    scrollToBottom();

    document.getElementById('send-btn').disabled = true;

    try {
      const body = { message: text };
      if (sessionId) body.session_id = sessionId;

      const res = await fetch(API + '/chat', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + token,
        },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      typing.remove();

      if (!res.ok) {
        addMessage('error', 'Error: ' + (data.detail || 'Something went wrong'));
        return;
      }

      sessionId = data.session_id;
      document.getElementById('session-info').textContent = 'Session: ' + sessionId;

      if (data.cost) {
        document.getElementById('cost-info').textContent =
          'Cost: $' + data.cost.total_cost_usd.toFixed(6) +
          ' (' + data.cost.total_calls + ' calls)';
      }

      const meta = [];
      if (data.agent_used) meta.push('Agent: ' + data.agent_used);
      if (data.cost) meta.push('$' + data.cost.total_cost_usd.toFixed(6));

      addMessage('assistant', data.reply, meta.join(' · '));

    } catch (err) {
      typing.remove();
      addMessage('error', 'Network error: ' + err.message);
    } finally {
      document.getElementById('send-btn').disabled = false;
      input.focus();
    }
  }

  // ── HELPERS ────────────────────────────────
  function addMessage(role, text, metaText) {
    const el = document.createElement('div');
    el.className = 'message ' + role;
    el.textContent = text;

    if (metaText) {
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = metaText;
      el.appendChild(meta);
    }

    document.getElementById('messages').appendChild(el);
    scrollToBottom();
  }

  function scrollToBottom() {
    const m = document.getElementById('messages');
    m.scrollTop = m.scrollHeight;
  }

  // Focus username on load
  document.getElementById('username').focus();
</script>
</body>
</html>
